<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modo Claro / Oscuro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body {
            background-color: white;
            color: black;
            font-family: Arial;
            margin: 0;
            padding: 20px;
            transition: 0.3s;
        }

        .contenedor {
            width: 70%;
            margin: 0 auto;
            background: #f7f7f7;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #ccc;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        h1 {
            text-align: center;
            color: #2a4b7c;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background-color: #2a4b7c;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1d355e;
        }

        .oscuro {
            background-color: #1a1a1a;
            color: white;
        }

        .oscuro .contenedor {
            background-color: #2a2a2a;
            border-color: #444;
        }

        .oscuro button {
            background-color: #444;
        }

        .oscuro button:hover {
            background-color: #666;
        }

    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Modo Claro / Oscuro</h1>

        <p>
            Esta página permite cambiar entre modo claro y modo oscuro 
        </p>

        <button id="boton">Modo oscuro</button>

    </div>

    <script>
        const boton = document.getElementById("boton");

        boton.addEventListener("click", function() {

            document.body.classList.toggle("oscuro");

            if (document.body.classList.contains("oscuro")) {
                boton.textContent = "Modo claro";
            } else {
                boton.textContent = "Modo oscuro";
            }

        });
    </script>

</body>
</html>
